name: Build & Push Docker Images

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: decisionbox-io
  IMAGE_TAGS: |
    type=ref,event=branch
    type=ref,event=tag
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=sha,prefix=
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  # Enforcement gate: a release must be a GPG-signed tag. On a v* tag push this
  # fails unless the tag is a valid signed tag (a lightweight/unsigned tag can't
  # ship images), so the manual signing step can't be silently skipped. On
  # branch / dispatch / PR builds there is no tag to check and it passes.
  verify-tag:
    name: Verify release tag is GPG-signed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # Import the trusted release public key from the PROTECTED default
          # branch, not the tagged commit — a tag could point at a commit that
          # swapped release-signing-key.asc for an attacker's own key.
          git fetch --force origin main
          git show origin/main:release-signing-key.asc | gpg --import
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if ! git tag -v "${GITHUB_REF_NAME}"; then
            echo "::error::release tag ${GITHUB_REF_NAME} is not a valid GPG-signed tag — cut releases with the 'Cut Signed Release' workflow (git tag -s)"
            exit 1
          fi

  gate:
    name: Check Publish Trigger
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Determine if publish should proceed
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] || \
             [[ "${{ github.ref_type }}" == "tag" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "pull_request" ]] || \
             echo "$COMMIT_MSG" | grep -qF '[publish-docker]'; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  detect-changes:
    name: Detect Changes
    needs: [gate]
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ""
          filters: |
            api:
              - 'services/api/**'
              - 'libs/**'
              - 'providers/**'
              - 'domain-packs/**'
            agent:
              - 'services/agent/**'
              - 'libs/**'
              - 'providers/**'
              - 'domain-packs/**'
            dashboard:
              - 'ui/dashboard/**'

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.agent == 'true' || needs.detect-changes.outputs.dashboard == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Lint API Dockerfile
        if: needs.detect-changes.outputs.api == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/api/Dockerfile
          failure-threshold: error

      - name: Lint Agent Dockerfile
        if: needs.detect-changes.outputs.agent == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/agent/Dockerfile
          failure-threshold: error

      - name: Lint Dashboard Dockerfile
        if: needs.detect-changes.outputs.dashboard == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ui/dashboard/Dockerfile
          failure-threshold: error

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-dockerfiles]
    if: always() && needs.detect-changes.result == 'success' && needs.lint-dockerfiles.result != 'failure'
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: decisionbox-api
            context: .
            dockerfile: services/api/Dockerfile
            changed: ${{ needs.detect-changes.outputs.api }}
          - service: decisionbox-agent
            context: .
            dockerfile: services/agent/Dockerfile
            changed: ${{ needs.detect-changes.outputs.agent }}
          - service: decisionbox-dashboard
            context: ui/dashboard
            dockerfile: ui/dashboard/Dockerfile
            changed: ${{ needs.detect-changes.outputs.dashboard }}

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true' && github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: echo "No changes for ${{ matrix.service }}, skipping" && exit 0

      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

      - uses: docker/setup-buildx-action@v3
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

      - name: Docker metadata
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build amd64 image
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Save image as artifact
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker save -o /tmp/${{ matrix.service }}.tar $TAGS

      - name: Upload image artifact
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  security:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    permissions:
      contents: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: decisionbox-api
            changed: ${{ needs.detect-changes.outputs.api }}
          - service: decisionbox-agent
            changed: ${{ needs.detect-changes.outputs.agent }}
          - service: decisionbox-dashboard
            changed: ${{ needs.detect-changes.outputs.dashboard }}

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true' && github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: echo "No changes for ${{ matrix.service }}, skipping" && exit 0

      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

      - name: Download image artifact
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp

      - name: Load image
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: docker load -i /tmp/${{ matrix.service }}.tar

      - name: Sanitize ref name
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        id: sanitize
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM with Syft
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}:${{ steps.sanitize.outputs.tag }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}
          output-file: sbom-${{ matrix.service }}.spdx.json
        env:
          SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES: true
          SYFT_GOLANG_MAIN_MODULE_VERSION_FROM_BUILD_SETTINGS: true

      - name: Scan vulnerabilities with Grype
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: anchore/scan-action@v6
        id: grype
        with:
          sbom: sbom-${{ matrix.service }}.spdx.json
          output-format: sarif
          fail-build: 'false'
          severity-cutoff: critical

      - name: Upload Grype scan results
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-${{ matrix.service }}'

      - name: Check license compliance with Grant
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grant/main/install.sh | sh -s -- -b /usr/local/bin
          SERVICE="${{ matrix.service }}"
          case "$SERVICE" in
            decisionbox-api)   DIR="services/api" ;;
            decisionbox-agent) DIR="services/agent" ;;
            *)                 echo "Skipping license check for $SERVICE (no Go source)"; exit 0 ;;
          esac
          grant check dir:$DIR -c .grant.yaml

  push:
    name: Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [verify-tag, detect-changes, build, security]
    if: always() && needs.verify-tag.result == 'success' && needs.security.result == 'success' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: decisionbox-api
            context: .
            dockerfile: services/api/Dockerfile
            changed: ${{ needs.detect-changes.outputs.api }}
          - service: decisionbox-agent
            context: .
            dockerfile: services/agent/Dockerfile
            changed: ${{ needs.detect-changes.outputs.agent }}
          - service: decisionbox-dashboard
            context: ui/dashboard
            dockerfile: ui/dashboard/Dockerfile
            changed: ${{ needs.detect-changes.outputs.dashboard }}

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true' && github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        run: echo "No changes for ${{ matrix.service }}, skipping" && exit 0

      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

      - name: Set up QEMU
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

      - name: Login to GHCR
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}
          tags: ${{ env.IMAGE_TAGS }}

      # Install cosign before the push so the release preflight can prove the key
      # actually works, and the sign step later reuses it.
      - name: Install cosign
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.3

      # Preflight BEFORE the push: on a release tag build, abort before anything
      # is published unless the signing key is present AND usable — otherwise an
      # unsigned (or unsignable) release image is already public by the time the
      # later cosign sign fails. Deriving the public key exercises the key +
      # password, so a malformed key or wrong password is caught here, not after.
      - name: Require usable signing key on release builds
        if: github.ref_type == 'tag'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ] || [ -z "${COSIGN_PASSWORD:-}" ]; then
            echo "::error::release tag build requires cosign signing secrets — aborting before publish"
            exit 1
          fi
          derived=$(cosign public-key --key env://COSIGN_PRIVATE_KEY 2>/dev/null | tr -d '[:space:]' || true)
          if [ -z "$derived" ]; then
            echo "::error::cosign signing key is set but not usable (bad key or wrong password) — aborting before publish"
            exit 1
          fi
          # The key must match the PUBLISHED public key, or a release signed with
          # it is unverifiable with the committed cosign.pub (e.g. a rotated secret
          # whose public half was never committed).
          committed=$(tr -d '[:space:]' < cosign.pub)
          if [ "$derived" != "$committed" ]; then
            echo "::error::signing key does not match the committed cosign.pub — a release signed with it would be unverifiable; update COSIGN_PRIVATE_KEY or cosign.pub"
            exit 1
          fi

      - name: Build multi-arch and push
        id: build
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Supply-chain provenance: cosign-sign the pushed image by its content
      # digest so anyone can verify it against our published public key. Keyed
      # (not keyless) with no transparency-log upload, so verification works
      # offline. See docs/deployment/verifying-images.md. cosign was installed
      # before the build (for the release preflight).
      - name: Sign image with cosign
        if: matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Non-release branch builds soft-skip until BOTH secrets are set. A
          # release tag build is guaranteed to have them by the preflight step,
          # so this only skips on branch builds. (We require the password too —
          # an encrypted key with no password would fail cosign after the push.)
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ] || [ -z "${COSIGN_PASSWORD:-}" ]; then
            echo "::warning::cosign signing secrets not fully set — skipping image signing for ${IMAGE_DIGEST%@*} (non-release build)"
            exit 0
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$IMAGE_DIGEST"
          echo "Signed: $IMAGE_DIGEST"

      - name: Configure AWS credentials (dev)
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.service == 'decisionbox-agent'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR (dev)
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.service == 'decisionbox-agent'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Push to ECR (dev)
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.service == 'decisionbox-agent'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPO: decisionbox-agent
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r ghcr_tag; do
            tag="${ghcr_tag##*:}"
            docker buildx imagetools create \
              --tag "$ECR_REGISTRY/$ECR_REPO:$tag" \
              "$ghcr_tag"
          done <<< "$GHCR_TAGS"

      - name: Configure AWS credentials (prod)
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.service == 'decisionbox-agent'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Login to Amazon ECR (prod)
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.service == 'decisionbox-agent'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID_PROD }}

      - name: Push to ECR (prod)
        if: (matrix.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && matrix.service == 'decisionbox-agent'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPO: decisionbox-agent
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r ghcr_tag; do
            tag="${ghcr_tag##*:}"
            docker buildx imagetools create \
              --tag "$ECR_REGISTRY/$ECR_REPO:$tag" \
              "$ghcr_tag"
          done <<< "$GHCR_TAGS"
